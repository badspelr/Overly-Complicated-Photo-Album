{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}

<form method="post">
    {% csrf_token %}
    
    <div style="margin-bottom: 20px;">
        <p><strong>Selected users:</strong> {{ user_count }}</p>
        <p><strong>Total active users in system:</strong> {{ total_users }}</p>
    </div>
    
    <div style="margin-bottom: 20px;">
        {{ form.as_p }}
    </div>
    
    <div class="submit-row">
        <input type="submit" name="send" value="Send Email" class="default" />
        <a href="{% url 'admin:auth_user_changelist' %}" class="button cancel-link">Cancel</a>
    </div>
    
    {% for obj in queryset %}
        <input type="hidden" name="_selected_action" value="{{ obj.pk }}" />
    {% endfor %}
</form>

<style>
.cancel-link {
    background: #f8f8f8;
    padding: 10px 15px;
    border: 1px solid #ddd;
    border-radius: 4px;
    text-decoration: none;
    color: #333;
    margin-left: 10px;
}
.cancel-link:hover {
    background: #e8e8e8;
}
</style>
{% endblock %}
